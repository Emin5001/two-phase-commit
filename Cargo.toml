[package]
name = "two-phase-commit"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "two_phase_commit"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.4"
ipc-channel = "0.23"
log = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stderrlog = "0.6"
